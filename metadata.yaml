name: friend_gate
display_name: 好友门卫
short_desc: 自动处理 QQ 好友申请与群邀请，带黑白名单、暗号和频率限制
desc: >-
  AstrBot 本身不处理 OneBot 的 request 事件，好友申请和群邀请会一直躺在 QQ 里没人管。
  这个插件订阅协议端的 request 事件，按黑名单 / 白名单 / 暗号 / 每小时上限决定同意还是拒绝，
  并把结果私聊告诉管理员。好友申请、被拉进群、别人申请进你的群，三种请求一套规则管完。
  同一个申请只会处理一次，误操作可以随时暂停。
help: |-
  /好友                查看运行状态与累计统计
  /好友 开 | 关        恢复 / 暂停自动处理（申请先留着）
  /好友 记录           查看最近处理过的申请
  /好友 路径           打印状态文件位置
  /好友 测试 <QQ> [验证语]      只试跑好友申请规则
  /好友 暗号 <词>      改验证语暗号（+词 追加、-词 删除、空 清空）
  /好友 必填 开 | 关    要求对方必须填验证语
  /好友 拒绝理由 <文本> 拒绝时回复的话（协议端支持才生效）
  /好友 群             群邀请与加群申请的完整状态
  /好友 群开 | 群关    开关自动同意入群邀请
  /好友 加群开 | 加群关  开关自动同意加群申请
  /好友 群白 <群号>    加群白名单（-群号 删除，空 清空）
  /好友 群黑 <群号>    加群黑名单（同上）
  /好友 群暗号 <词>    邀请附言要含的词
  /好友 群测试 <群号> [附言]    只试跑群邀请规则
version: 1.2.2
author: xuanbaon
repo: https://github.com/xuanbaon/astrbot_plugin_friend_gate
astrbot_version: ">=4.17.0"
tags:
  - 好友
  - 群邀请
  - 自动处理
  - 运维
